---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/channel
        value: ebdnlatest
      - op: replace
        path: /spec/source
        value: ebdn-redhat-operators
    target:
      group: operators.coreos.com
      kind: Subscription
      namespace: openshift-adp
      version: v1alpha1
